# Filo geneli secret taraması — Graf AI / Grafclouds standardı (2026-08-13).
# Bu dosya 6 org + ssarioglu'daki tüm aktif repolara merkezî olarak dağıtıldı;
# yereldeki değişiklik filodan ayrışma demektir.
name: gitleaks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: secret taraması
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 şart — gitleaks commit GEÇMİŞİNİ tarar, sığ klonda
      # yalnızca son commit görünür ve tarama sahte-yeşil döner.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Sürüm sabit + checksum: gitleaks release'i değişirse (ya da araya
      # girilirse) job kurulum adımında durur, sessizce farklı bir ikili çalışmaz.
      - name: gitleaks kur
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # .gitleaks-baseline.json = rollout anında repo geçmişinde ZATEN bulunan
      # sızıntılar (redakte). Onlar üzerinden kırmızı yakmıyoruz: kalıcı kırmızı
      # gate atlanan gate olur. Kırdığı tek şey YENİ sızıntı. Baseline'daki her
      # kayıt aynı zamanda rotasyon backlog'udur — dosya küçüldükçe borç kapanır.
      - name: geçmişi tara
        run: |
          set -euo pipefail
          args=(git . --redact --no-banner
                --report-format json --report-path "$RUNNER_TEMP/gitleaks-report.json")
          if [ -f .gitleaks-baseline.json ]; then
            args+=(--baseline-path .gitleaks-baseline.json)
          fi
          gitleaks "${args[@]}"

      - name: bulgu raporunu yükle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks-report.json
          if-no-files-found: ignore
